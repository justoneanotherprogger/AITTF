<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/ext/ws.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #gen-spinner.htmx-request { opacity: 1 !important; }
    #gen-btn.htmx-request, #gen-btn[disabled] { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    #generate-status.loading #gen-btn { pointer-events: none; opacity: 0.5; cursor: not-allowed; }
    #generate-status.loading #gen-spinner { opacity: 1 !important; }
    textarea.htmx-request { opacity: 0.6; }
  </style>
  <title>Предыстории — AI Tabletop Framework</title>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center"
      hx-ext="ws" ws-connect="/ws/chat">
  <div class="w-full max-w-2xl p-6">
    <h1 class="text-3xl font-bold text-center mb-2">Предыстории персонажей</h1>
    <p class="text-gray-400 text-center mb-8">Опишите прошлое каждого героя — мастер органично вплетёт эти истории в мир</p>

    {% include "backstories_players.html" %}

    <div id="generate-status" hx-get="/lobby/backstory_status" hx-trigger="load, backstory-updated from:body" hx-swap="innerHTML">
      <div class="text-gray-500 text-sm text-center">Загрузка...</div>
    </div>

    <div class="mt-8 text-center">
      <button type="button" hx-post="/api/game/reset" hx-disabled-elt="this"
              hx-confirm="Вы уверены, что хотите удалить текущую игру и начать заново?"
              class="text-xs text-red-400 hover:text-red-300 underline">Сбросить партию</button>
    </div>
  </div>
  <script>
    document.body.addEventListener('htmx:wsAfterMessage', function(evt) {
      var msg = evt.detail.message;
      if (msg.indexOf('__ws-marker-backstory-updated') !== -1) {
        htmx.ajax('GET', '/lobby/backstory_status', {target: '#generate-status', swap: 'innerHTML'});
        htmx.ajax('GET', '/lobby/backstory_players', {target: '#backstory-players', swap: 'outerHTML'});
      }
      if (msg.indexOf('__ws-marker-generating-world') !== -1) {
        document.getElementById('generate-status').innerHTML =
          '<div class="text-amber-400 text-sm text-center animate-pulse">✦ Мастер создаёт мир... Подождите</div>';
      }
      if (msg.indexOf('__ws-marker-world-generated') !== -1) {
        window.location.href = '/';
      }
      if (msg.indexOf('__ws-marker-game-reset') !== -1) {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
