<div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3">
  {% for player in players %}
    <div class="bg-gray-800 rounded-lg border border-gray-700 p-3 flex items-center justify-between min-h-[56px]">
      <div>
        <span class="font-medium">{{ player.name }}</span>
        {% if current_player_id and player.id == current_player_id %}
          <span class="text-xs text-emerald-400 ml-2">(Это вы)</span>
        {% endif %}
      </div>
    </div>
  {% endfor %}
  {% if players %}<div id="players-flag" data-has-players="true" style="display:none"></div>{% endif %}
</div>
