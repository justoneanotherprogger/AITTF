<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/ext/ws.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #start-area { display: none; }
    body:has(#entry-has-player) #start-area { display: flex; }
    #start-btn[disabled] { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    #reset-area { display: block; }
    body:has(#locked-flag) #reset-area { display: none; }
  </style>
  <title>Лобби — AI Tabletop Framework</title>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center"
      hx-ext="ws" ws-connect="/ws/chat">
  <div class="w-full max-w-2xl p-6">
    <h1 class="text-3xl font-bold text-center mb-2">AI Tabletop Framework</h1>
    <p class="text-gray-400 text-center mb-8">Добавьте персонажей, чтобы начать игру</p>

    <div id="entry-block">
      {{ entry_block|safe }}
    </div>

    <div id="lobby-meta">
      <div id="player-count" class="text-sm text-gray-400 text-center mb-4">В лобби: {{ players|length }}</div>
      <div id="start-area" class="w-full flex justify-center mb-6">
        <button id="start-btn" type="button"
                hx-post="/lobby/start"
                hx-disabled-elt="this"
                class="bg-amber-600 hover:bg-amber-500 text-white px-8 py-3 rounded-lg text-lg font-medium transition"
                {% if not players %}disabled{% endif %}>
          Начать игру
        </button>
      </div>
    </div>

    <div id="lobby-slots">
      {% include "slots.html" %}
    </div>

    <div id="reset-area" class="mt-4 text-center">
      <button type="button" hx-post="/api/game/reset" hx-disabled-elt="this"
              hx-confirm="Вы уверены, что хотите удалить текущую игру и начать заново?"
              class="text-xs text-red-400 hover:text-red-300 underline">Сбросить партию</button>
    </div>
  </div>
  <script>
    document.body.addEventListener('htmx:wsAfterMessage', function(evt) {
      var msg = evt.detail.message;
      if (msg.indexOf('__ws-marker-refresh-lobby') !== -1) {
        htmx.ajax('GET', '/lobby/slots', {target: '#lobby-slots', swap: 'innerHTML'});
        htmx.ajax('GET', '/lobby/entry_block', {target: '#entry-block', swap: 'outerHTML'});
        htmx.ajax('GET', '/lobby/lobby_meta', {target: '#lobby-meta', swap: 'outerHTML'});
      }
      if (msg.indexOf('__ws-marker-game-started') !== -1) {
        window.location.href = '/backstories';
      }
      if (msg.indexOf('__ws-marker-world-generated') !== -1) {
        window.location.href = '/';
      }
      if (msg.indexOf('__ws-marker-game-reset') !== -1) {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
